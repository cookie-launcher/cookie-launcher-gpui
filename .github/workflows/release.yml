name: Release

# Etiket push'unda (v*) paket üretip sürüme yükler; elle de çalıştırılabilir.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (AppImage + deb + tarball)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libx11-xcb-dev \
            libvulkan-dev libasound2-dev \
            dpkg-dev libfuse2

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo önbelleği
        uses: Swatinem/rust-cache@v2

      - name: Testler
        run: cargo test --locked

      - name: Release derlemesi
        run: cargo build --release --locked

      - name: appimagetool
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: Paketler (tarball + AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./packaging/build-bundle.sh

      - name: Paket (.deb)
        run: ./packaging/build-deb.sh

      - name: Dosyaları listele
        run: ls -lh dist/*.tar.gz dist/*.AppImage dist/*.deb

      - name: Workflow çıktısı
        uses: actions/upload-artifact@v4
        with:
          name: cookie-launcher-linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo önbelleği
        uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Testler
        run: cargo test --locked

      - name: Paket (zip)
        shell: pwsh
        run: ./packaging/build-windows.ps1

      - name: Dosyaları listele
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, Length

      - name: Workflow çıktısı
        uses: actions/upload-artifact@v4
        with:
          name: cookie-launcher-windows
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Sürüme yükle
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Paketleri indir
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Sürüme yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          TAG="v${VERSION}"
          FILES=(dist/*.tar.gz dist/*.AppImage dist/*.deb dist/*.zip)
          echo "yüklenecek dosyalar:"; ls -lh "${FILES[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "Cookie Launcher ${TAG}" \
              --notes-file .github/release-notes.md
          fi
          gh release view "$TAG" --json assets -q '.assets[] | "\(.name)  \(.size) bayt"'
