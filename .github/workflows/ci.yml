name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Testler (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libx11-xcb-dev \
            libvulkan-dev libasound2-dev

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo önbelleği
        uses: Swatinem/rust-cache@v2

      - name: Derleme
        run: cargo build --locked --all-targets

      - name: Testler
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        continue-on-error: true

  # Gerçek Windows makinesinde derleme + test. Çapraz derleme yerine yerel
  # runner: gpui Windows'ta DirectX'e bağlandığı için çapraz link kırılgan.
  windows:
    name: Derleme ve test (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo önbelleği
        uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Derleme (check)
        run: cargo check --locked --all-targets

      - name: Testler
        run: cargo test --locked
