[workspace]
members = ["xtask"]

[package]
name = "cookie-launcher-gpui"
version = "0.1.0"
edition = "2021"
description = "Cookie Launcher — native GPUI client for the Cookie Launcher Python core"

[dependencies]
gpui-kit = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
hmac = "0.12"
sha2 = "0.10"
ureq = "3"
socket2 = "0.6"
anyhow = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
